<div class="page-shell">
  <header class="hero">
    <div>
      <p class="eyebrow">Kapalı grup sözleşmesi</p>
      <h1>Sözleşme metnini hazırla</h1>
      <p class="hero-copy">
        Şablondaki değişkenleri doldur, sözleşme metnini kontrol et ve dashboard'a kaydet.
      </p>
    </div>
  </header>

  <form class="editor-layout" [formGroup]="form" (ngSubmit)="submitForm()">
    <section class="panel template-panel">
      <div class="panel-heading">
        <h2>Sözleşme metni</h2>
        <button class="ghost-button" type="button" (click)="resetTemplate()">Şablona dön</button>
      </div>

      <textarea
        class="template-area"
        formControlName="contractTemplate"
        rows="28"
        spellcheck="false"
      ></textarea>
    </section>

    <aside class="panel variables-panel">
      <div class="panel-heading">
        <h2>Değişkenler</h2>
      </div>

      <div class="variable-groups">
        <section *ngFor="let group of variableGroups" class="variable-group">
          <h3>{{ group.name }}</h3>

          <label *ngFor="let field of group.fields">
            <span>{{ field.label }}</span>
            <input [formControlName]="field.key" type="text" [placeholder]="field.placeholder" />
          </label>
        </section>
      </div>
    </aside>

    <section class="panel preview-panel">
      <div class="panel-heading">
        <h2>Canlı önizleme</h2>
      </div>

      <article class="document-preview">{{ renderedContractText }}</article>
    </section>

    <section class="submit-panel">
      <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

      <button class="primary-button" type="submit" [disabled]="saving">
        {{ saving ? 'Kaydediliyor...' : 'Sözleşmeyi dashboard’a kaydet' }}
      </button>
    </section>
  </form>
</div>
