<div class="page-shell">
  <header class="hero">
    <div>
      <p class="eyebrow">Kapalı grup sözleşmesi</p>
      <h1>Sözleşme metnini hazırla</h1>
      <p class="hero-copy">
        Kutulu alanları metnin üzerinde doldur. Zorunlu alanlar tamamlandığında sözleşme dashboard'a kaydedilir.
      </p>
    </div>

    <div class="required-status" [class.complete]="missingRequiredCount === 0">
      {{ missingRequiredCount === 0 ? 'Zorunlu alanlar tamam' : missingRequiredCount + ' zorunlu alan eksik' }}
    </div>
  </header>

  <form class="contract-workspace" [formGroup]="form" (ngSubmit)="submitForm()">
    <section class="document-panel">
      <article class="legal-document" aria-label="Doldurulabilir sözleşme metni">
        <div *ngFor="let line of templateLines" class="document-line" [ngClass]="line.className">
          <ng-container *ngFor="let part of line.parts">
            <span *ngIf="part.type === 'text'">{{ part.value }}</span>

            <span
              *ngIf="part.type === 'field'"
              class="inline-field"
              [class.required]="isRequired(part.key)"
              [class.optional]="!isRequired(part.key)"
              [class.missing]="isMissing(part.key)"
            >
              <label>
                <span class="field-meta">
                  <span class="field-label">{{ getVariableLabel(part.key) }}</span>
                  <span class="field-rule">{{ isRequired(part.key) ? 'Zorunlu' : 'Opsiyonel' }}</span>
                </span>
                <input
                  [formControlName]="part.key"
                  type="text"
                  [placeholder]="getVariablePlaceholder(part.key)"
                  [attr.aria-label]="getVariableLabel(part.key)"
                />
              </label>
            </span>
          </ng-container>
        </div>
      </article>
    </section>

    <section class="submit-panel">
      <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

      <button class="primary-button" type="submit" [disabled]="saving">
        {{ saving ? 'Kaydediliyor...' : 'Sözleşmeyi dashboard’a kaydet' }}
      </button>
    </section>
  </form>
</div>
